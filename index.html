  <body>
    __GTM_BODY__

    <!-- LCP מובייל: אותה תמונה כמו ב-Hero לפני React; מוסתר מ־768px; מוסר בכניסה לדפים שאינם הבית -->
    <style>
      #static-hero-lcp-fallback {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        max-width: none;
        object-fit: cover;
        object-position: 76% 40%;
        background-color: #171717;
        pointer-events: none;
      }
      @media (min-width: 768px) {
        #static-hero-lcp-fallback {
          display: none !important;
        }
      }
    </style>
    <img
      id="static-hero-lcp-fallback"
      src="/hero-bg.webp"
      alt=""
      width="1920"
      height="1080"
      fetchpriority="high"
      decoding="async"
      loading="eager"
      aria-hidden="true"
    />
    <!-- מודול = deferred כברירת מחדל — לא חוסם פרסור HTML; אותה לוגיקת הסרה כמו קודם -->
    <script type="module">
      try {
        var p = window.location.pathname || ''
        if (p !== '/' && p !== '') {
          var el = document.getElementById('static-hero-lcp-fallback')
          if (el && el.parentNode) el.parentNode.removeChild(el)
        }
      } catch (e) {}
    </script>

    <div id="root" style="position: relative; z-index: 1"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        document.body.style.overflow = ''
      })

      (function () {
        var loaded = false
        var loadScript = function () {
          if (loaded) return
          loaded = true
          window.removeEventListener('scroll', loadScript)
          window.removeEventListener('click', loadScript)
          var s = document.createElement('script')
          s.src = 'https://cdn.enable.co.il/licenses/enable-L54786fccdpmdkdu-0426-81289/init.js'
          s.async = true
          document.body.appendChild(s)
        }
        window.addEventListener('scroll', loadScript, { once: true, passive: true })
        window.addEventListener('click', loadScript, { once: true })
      })()
    </script>
  </body>
